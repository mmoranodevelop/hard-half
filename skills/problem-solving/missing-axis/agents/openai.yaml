# Codex and other Agent-Skills harnesses read this for skill-picker metadata.
# Channel A (`npx skills add`) installs into those harnesses too, so without it
# the skill shows up as a bare slug with no description.
#
# No `policy` block: missing-axis is model-invoked in both harnesses.
# See ../../../../.agents/invocation.md
interface:
  display_name: "Missing Axis"
  short_description: "Find the measurable coordinate the current search space does not have"
