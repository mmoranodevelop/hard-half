# Codex and other Agent-Skills harnesses read this for skill-picker metadata.
# Channel A (`npx skills add`) installs into those harnesses too, so without it
# the skill shows up as a bare slug with no description.
#
# No `policy` block: create-project is model-invoked in both harnesses.
# The interview gate — nothing is written to disk before the user confirms —
# is what makes autonomous invocation safe despite the filesystem side effects.
# See ../../../../.agents/invocation.md
interface:
  display_name: "Create Project"
  short_description: "Scaffold a project that survives a cold start"
